<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sử dụng Bootstrap 5 để có giao diện đẹp nhanh chóng -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <style>
        body { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background-color: #343a40; color: white; }
        .sidebar a { color: rgba(255, 255, 255, 0.8); text-decoration: none; display: block; padding: 1rem; }
        .sidebar a:hover, .sidebar a.active { background-color: #495057; color: white; }
        .content { flex-grow: 1; padding: 2rem; }
    </style>
</head>
<body>
    <!-- === SIDEBAR === -->
    <div class="sidebar d-flex flex-column p-3">
        <h4 class="text-center">Admin Panel</h4>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
            </li>
            <li>
                <!-- Đặt class 'active' để làm nổi bật trang hiện tại -->
                <a href="{{ url_for('admin_classes') }}" class="nav-link active"><i class="fas fa-school me-2"></i> Quản lý Lớp học</a>
            </li>
            <li>
                <a href="#" class="nav-link"><i class="fas fa-user-graduate me-2"></i> Quản lý Học sinh</a>
            </li>
            <li>
                <a href="#" class="nav-link"><i class="fas fa-book me-2"></i> Quản lý Môn học</a>
            </li>
        </ul>
    </div>

    <!-- === NỘI DUNG CHÍNH === -->
    <div class="content">
        {% block content %}
        <!-- Nội dung của từng trang cụ thể sẽ được chèn vào đây -->
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
