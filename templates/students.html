{% extends "layout.html" %}
{% block title %}Quản lý Học sinh{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-user-graduate me-2"></i>Quản lý Học sinh - Lớp 9/1</h2>
    <button class="btn btn-primary" id="addStudentBtn">
        <i class="fas fa-plus me-2"></i>Thêm học sinh mới
    </button>
</div>

<!-- Vùng chứa danh sách học sinh -->
<div id="studentList">
    <div class="text-center p-5">
        <div class="spinner-border text-primary"></div>
        <p>Đang tải danh sách học sinh...</p>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/students.js') }}"></script>
{% endblock %}
